name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      # Both ends of the supported range, so the floor in package.json is a
      # number that has actually been run rather than a hope.
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ffmpeg (audio probing in integration tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      # Tests run BEFORE the full build on purpose: `npm test` must work from
      # a fresh `npm ci` (it builds the shared workspace itself) and not
      # depend on a pre-existing dist/.
      - name: Unit and integration tests (clean install order)
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build (bundles + service-worker precache)
        run: npm run build
      - name: Assert service worker precache was injected
        run: |
          grep -q "rp-shell-" web/dist/sw.js
          ! grep -q "__RP_PRECACHE__" web/dist/sw.js
          grep -q '"/assets/' web/dist/sw.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: RP_SESSION_SECRET=ci-validation-secret docker compose config -q
      - name: Build image
        run: docker build -t readport:ci .
      - name: Smoke test container (health, setup-token gate)
        run: |
          docker run -d --name tl -p 8383:8383 \
            -e RP_SESSION_SECRET=ci-smoke-secret-0123456789 \
            -e RP_SETUP_TOKEN=ci-smoke-setup-token readport:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8383/api/health; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || (docker logs tl; exit 1)
          curl -fsS http://127.0.0.1:8383/api/setup/status | grep needsSetup

          # This container sets RP_SETUP_TOKEN, so it is LOCKED: setup with no
          # token and setup with a wrong one must both be refused by the token
          # check. (Omitting the field is 403, not 400 - it is optional in the
          # schema because an unlocked instance needs none.)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8383/api/setup \
            -H 'content-type: application/json' -H 'x-rp-csrf: 1' \
            -d '{"username":"admin","password":"smoke-password-123"}')
          [ "$code" = "403" ] || (echo "tokenless setup returned $code"; exit 1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8383/api/setup \
            -H 'content-type: application/json' -H 'x-rp-csrf: 1' \
            -d '{"username":"admin","password":"smoke-password-123","setupToken":"wrong-token"}')
          [ "$code" = "403" ] || (echo "wrong-token setup returned $code"; exit 1)

          # Correct token creates the admin; a second attempt is closed.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8383/api/setup \
            -H 'content-type: application/json' -H 'x-rp-csrf: 1' \
            -d '{"username":"admin","password":"smoke-password-123","setupToken":"ci-smoke-setup-token"}')
          [ "$code" = "200" ] || (echo "valid setup returned $code"; docker logs tl; exit 1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8383/api/setup \
            -H 'content-type: application/json' -H 'x-rp-csrf: 1' \
            -d '{"username":"other","password":"smoke-password-123","setupToken":"ci-smoke-setup-token"}')
          [ "$code" = "409" ] || (echo "second setup returned $code"; exit 1)
          docker rm -f tl

      - name: Smoke test container (no RP_SETUP_TOKEN - the default)
        run: |
          # The unlocked instance is what most people run, so it is what CI
          # must exercise: no token to fetch, the wizard helpers answer, and
          # the window still shuts the moment an account exists.
          docker run -d --name tl2 -p 8385:8383 \
            -e RP_SESSION_SECRET=ci-open-secret-0123456789 readport:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8385/api/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || (docker logs tl2; exit 1)
          curl -fsS http://127.0.0.1:8385/api/setup/status | grep '"setupTokenRequired":false'
          docker logs tl2 2>&1 | grep -q 'setup is OPEN' || (docker logs tl2; echo "no open-setup warning"; exit 1)

          # The self-check the wizard shows on its last screen must answer.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8385/api/preflight \
            -H 'content-type: application/json' -H 'x-rp-csrf: 1' -d '{}')
          [ "$code" = "200" ] || (echo "preflight before setup returned $code"; exit 1)

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8385/api/setup \
            -H 'content-type: application/json' -H 'x-rp-csrf: 1' \
            -d '{"username":"admin","password":"smoke-password-123"}')
          [ "$code" = "200" ] || (echo "tokenless setup returned $code"; docker logs tl2; exit 1)

          # Shut for good: no second admin, and the helpers close with it.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8385/api/setup \
            -H 'content-type: application/json' -H 'x-rp-csrf: 1' \
            -d '{"username":"other","password":"smoke-password-123"}')
          [ "$code" = "409" ] || (echo "second setup returned $code"; exit 1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8385/api/preflight \
            -H 'content-type: application/json' -H 'x-rp-csrf: 1' -d '{}')
          [ "$code" = "403" ] || (echo "preflight after setup returned $code"; exit 1)
          docker rm -f tl2

      - name: Alignment folder is claimed for the app user
        run: |
          # People create this folder with `mkdir` on the host, so it arrives
          # root-owned. The entrypoint must take it over, or every alignment
          # silently fails to save.
          mkdir -p /tmp/rp-align && sudo chown 0:0 /tmp/rp-align
          docker run -d --name al -p 8384:8383 \
            -e RP_SESSION_SECRET=ci-align-secret-0123456789 \
            -e RP_SETUP_TOKEN=ci-align-token \
            -e RP_ALIGNMENT_DIRS=/library/alignments \
            -v /tmp/rp-align:/library/alignments readport:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8384/api/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || (docker logs al; exit 1)
          docker exec -u 1000:1000 al sh -c 'touch /library/alignments/.w' \
            || (echo "alignment dir is not writable by the app user"; docker logs al; exit 1)
          docker rm -f al

  # Publishing is a job of this workflow, not a workflow of its own, so it
  # cannot run against a red main: a separate workflow on the same trigger
  # raced the checks and could tag :latest from a commit that never passed.
  publish:
    needs: [checks, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only. Building arm64 here means QEMU-emulating a full npm
          # install, which takes long enough to be its own problem; arm64 hosts
          # build from source with the compose file, which is its default.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
